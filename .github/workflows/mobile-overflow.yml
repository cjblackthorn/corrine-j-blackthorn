name: Validate Astro mobile overflow (no deploy)

on:
  push:
    branches:
      - fix/mobile-overflow-20261024
  pull_request:
    branches: [main]
    paths:
      - src/styles/global.css
      - scripts/check-mobile-overflow.cjs
      - .github/workflows/mobile-overflow.yml

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install site dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Test actual built site at mobile viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          node scripts/check-mobile-overflow.cjs
      - name: Preserve diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-overflow-qa
          path: mobile-overflow-diagnostic.png
          if-no-files-found: warn
          retention-days: 7
