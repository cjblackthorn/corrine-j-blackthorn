# Temporary, branch-scoped lockfile generation. Remove after completion.
name: Phase 2 Pin Astro Dependencies

on:
  push:
    branches:
      - chore/phase2-lock-astro-dependencies

permissions:
  contents: write

jobs:
  pin-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: chore/phase2-lock-astro-dependencies
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve currently supported Astro packages
        run: npm install --no-audit --no-fund
      - name: Pin installed direct dependency versions exactly
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageFile = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const dep of ['astro', '@astrojs/mdx', 'sharp']) {
            const installed = JSON.parse(fs.readFileSync('node_modules/' + dep + '/package.json', 'utf8'));
            packageFile.dependencies[dep] = installed.version;
            console.log(dep + ' ' + installed.version);
          }
          packageFile.engines = { node: '>=24.0.0' };
          fs.writeFileSync('package.json', JSON.stringify(packageFile, null, 2) + '\n');
          NODE
      - name: Reconcile npm lockfile with exact direct dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and Astro build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock exact Astro versions and transitive dependencies"
            git push
          fi
